name: Run Python Script

on:
schedule:
    # 北京时间 早上6点
    - cron: '0 22 * * *'
    # 北京时间 中午11点
    - cron: '0 3 * * *'
    # 北京时间 下午4点
    - cron: '0 8 * * *'
    # 北京时间 晚上9点
    - cron: '0 13 * * *'
    # 北京时间 凌晨0点
    - cron: '0 16 * * *'
  workflow_dispatch: # 允许手动点击测试

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run script
        run: python main.py
